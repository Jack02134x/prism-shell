# Prism's default hypridle config. install.sh copies it to ~/.config/hypr/hypridle.conf
# only if you don't have one already.

general {
    # Prism's lock screen (falls back to hyprlock when Quickshell isn't running)
    lock_cmd = pidof quickshell >/dev/null && qs ipc call lock lock || (pidof hyprlock || hyprlock)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3 min: dim the backlight
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 4 min: lock
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# 5 min: screens off
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

